<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Azamat Food — Себет</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{height:80px;background:#151513;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{font-size:27px;font-weight:900}.logo span{color:#ffc21a}
.back{background:#292925;color:#fff;border:1px solid #444;border-radius:15px;padding:12px 16px;font-weight:800}
main{width:min(700px,94vw);margin:25px auto}
h1{font-size:34px;margin-bottom:20px}
.cart{background:#1b1b19;border:1px solid #333;border-radius:22px;overflow:hidden}
.item{padding:20px;border-bottom:1px solid #333;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.info{flex:1;min-width:150px}
.itemname{font-size:19px;font-weight:800}
.price{color:#aaa;margin-top:5px}
.qty{display:flex;align-items:center;gap:9px}
.qty button{width:42px;height:42px;border:1px solid #444;background:#292925;color:#fff;border-radius:12px;font-size:24px}
.qty b{min-width:22px;text-align:center}
.itemtotal{font-weight:900}
.total{padding:22px;display:flex;justify-content:space-between;font-size:23px;font-weight:900}
.empty{text-align:center;padding:70px 20px;color:#aaa}
.empty .icon{font-size:70px;margin-bottom:15px}
.empty b{display:block;color:#fff;font-size:26px;margin-bottom:8px}
.menu{display:inline-block;background:#ffc21a;color:#111;text-decoration:none;padding:15px 22px;border-radius:16px;font-weight:900;margin-top:15px}
.checkout{margin-top:20px;background:#1b1b19;border:1px solid #333;border-radius:22px;padding:22px}
.checkout h2{font-size:27px;margin-bottom:18px}
label{display:block;margin-bottom:15px;font-weight:700}
input{width:100%;margin-top:8px;padding:17px;border-radius:15px;border:1px solid #444;background:#10100f;color:#fff;font-size:17px}
.send{width:100%;height:60px;border:0;border-radius:18px;background:#ffc21a;color:#111;font-size:19px;font-weight:900}
.note{text-align:center;color:#999;font-size:13px;margin-top:12px}
</style>
</head>

<body>

<header>
<div class="logo">Azamat <span>Food</span></div>
<button class="back" onclick="location.href='index.html'">← Ас мәзірі</button>
</header>

<main>

<h1>🛒 Себет</h1>

<div id="cart"></div>

<div id="checkout" class="checkout" style="display:none">

<h2>Тапсырыс беру</h2>

<label>
👤 Аты-жөніңіз
<input id="name" placeholder="Аты-жөніңізді енгізіңіз">
</label>

<label>
☎ Телефон нөміріңіз
<input id="phone" type="tel" placeholder="+7 7XX XXX XX XX">
</label>

<button class="send" onclick="order()">✈ Тапсырыс беру</button>

<div class="note">
Тапсырыс бергеннен кейін Telegram-ға жіберіледі және сізге алу коды беріледі.
</div>

</div>

</main>

<script>

const WEB_APP_URL="https://script.google.com/macros/s/AKfycbyYx48fYTYzM6Yuukl2-Nb8_IqkUgyiRJgPRRBQs_RpMrHwcwdX39y9nt90wKQfFD8a/exec";

let cart=[];

try{
cart=JSON.parse(localStorage.getItem("azamat_food_cart")||"[]");
if(!Array.isArray(cart)) cart=[];
}catch(e){
cart=[];
}

function saveCart(){
localStorage.setItem("azamat_food_cart",JSON.stringify(cart));
}

function render(){

const box=document.getElementById("cart");
const checkout=document.getElementById("checkout");

if(!cart.length){

box.innerHTML=`
<div class="cart">
<div class="empty">
<div class="icon">🛒</div>
<b>Себет бос</b>
<span>Тауарларды таңдаңыз</span>
<br>
<a class="menu" href="index.html">Ас мәзіріне өту</a>
</div>
</div>`;

checkout.style.display="none";
return;
}

let sum=0;

box.innerHTML='<div class="cart">'+cart.map((x,i)=>{

const price=Number(x.p)||0;
const qty=Number(x.q)||0;
const itemSum=price*qty;

sum+=itemSum;

return `
<div class="item">

<div class="info">
<div class="itemname">${x.n||"Тауар"}</div>
<div class="price">${price.toLocaleString()} ₸</div>
</div>

<div class="qty">
<button onclick="changeQty(${i},-1)">−</button>
<b>${qty}</b>
<button onclick="changeQty(${i},1)">+</button>
</div>

<div class="itemtotal">${itemSum.toLocaleString()} ₸</div>

</div>`;

}).join('')+

`<div class="total">
<span>Барлығы:</span>
<span>${sum.toLocaleString()} ₸</span>
</div>
</div>`;

checkout.style.display="block";
}

function changeQty(i,d){

cart[i].q=Number(cart[i].q)+d;

if(cart[i].q<=0){
cart.splice(i,1);
}

saveCart();
render();
}

async function order(){

const name=document.getElementById("name").value.trim();
const phone=document.getElementById("phone").value.trim();

if(!name||!phone){
alert("Аты-жөніңіз және телефон нөміріңізді толтырыңыз.");
return;
}

if(!cart.length){
alert("Себет бос.");
return;
}

const sum=cart.reduce(
(a,x)=>a+(Number(x.p)||0)*(Number(x.q)||0),
0
);

const items=cart.map(x=>
`${x.n} × ${x.q} = ${(Number(x.p)*Number(x.q)).toLocaleString()} ₸`
).join("\n");

const code=String(Math.floor(1000+Math.random()*9000));

const payload={
name:name,
phone:phone,
address:"Үйден алу",
items:items,
total:sum,
code:code
};

try{

const response=await fetch(WEB_APP_URL,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify(payload)
});

const result=await response.json();

const orderNo=
result.orderNumber||
result.order?.orderNumber||
result.data?.orderNumber||
result.number||
"";

localStorage.removeItem("azamat_food_cart");

document.body.innerHTML=`


<div style="
min-height:100vh;
background:#f5f5f5;
font-family:Arial,sans-serif;
padding:25px 15px;
display:flex;
align-items:center;
justify-content:center;
">

<div style="
background:white;
color:#111;
width:100%;
max-width:480px;
border-radius:24px;
padding:30px 22px;
box-shadow:0 8px 30px rgba(0,0,0,.12);
text-align:center;
">


<h1>Azamat <span style="color:#ffc21a">Food</span></h1>


<div style="
margin:25px 0;
padding:18px;
background:#fff8df;
border-radius:18px;
">


<div style="
font-size:48px;
font-weight:900;
">
№${orderNo}
</div>

</div>

<div style="color:#777">
Алу коды
</div>

<div style="
font-size:42px;
font-weight:900;
letter-spacing:5px;
">
${code}
</div>

<div style="
margin-top:12px;
font-size:15px;
color:#555;
">
Тапсырысыңызды алғанда<br>
<strong>осы кодты көрсетіңіз</strong>
</div>

<div style="
height:1px;
background:#eee;
margin:25px 0;
"></div>

<div style="
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:900;
">
<span>Барлығы:</span>
<span>${sum.toLocaleString()} ₸</span>
</div>

<button
onclick="location.href='index.html'"
style="
margin-top:28px;
width:100%;
height:58px;
border:0;
border-radius:17px;
background:#ffc21a;
color:#111;
font-size:18px;
font-weight:900;
">
← Ас мәзіріне
</button>

</div>
</div>

`;

}catch(error){

alert("Тапсырысты жіберу кезінде қате болды. Қайта көріңіз.");
console.error(error);

}

}

render();

</script>

</body>
</html>
