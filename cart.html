<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Azamat Food — Себет</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{height:80px;background:#151513;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{font-size:27px;font-weight:900}.logo span{color:#ffc21a}
.back{background:#292925;color:#fff;border:1px solid #444;border-radius:15px;padding:12px 16px;font-weight:800}
main{width:min(700px,94vw);margin:25px auto}
h1{font-size:34px;margin-bottom:20px}
.cart{background:#1b1b19;border:1px solid #333;border-radius:22px;overflow:hidden}
.item{padding:20px;border-bottom:1px solid #333;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.info{flex:1;min-width:150px}
.itemname{font-size:19px;font-weight:800}
.price{color:#aaa;margin-top:5px}
.qty{display:flex;align-items:center;gap:9px}
.qty button{width:42px;height:42px;border:1px solid #444;background:#292925;color:#fff;border-radius:12px;font-size:24px}
.qty b{min-width:22px;text-align:center}
.itemtotal{font-weight:900}
.total{padding:22px;display:flex;justify-content:space-between;font-size:23px;font-weight:900}
.empty{text-align:center;padding:70px 20px;color:#aaa}
.empty .icon{font-size:70px;margin-bottom:15px}
.empty b{display:block;color:#fff;font-size:26px;margin-bottom:8px}
.menu{display:inline-block;background:#ffc21a;color:#111;text-decoration:none;padding:15px 22px;border-radius:16px;font-weight:900;margin-top:15px}
.checkout{margin-top:20px;background:#1b1b19;border:1px solid #333;border-radius:22px;padding:22px}
.checkout h2{font-size:27px;margin-bottom:18px}
label{display:block;margin-bottom:15px;font-weight:700}
input{width:100%;margin-top:8px;padding:17px;border-radius:15px;border:1px solid #444;background:#10100f;color:#fff;font-size:17px}
.send{width:100%;height:60px;border:0;border-radius:18px;background:#ffc21a;color:#111;font-size:19px;font-weight:900}
.note{text-align:center;color:#999;font-size:13px;margin-top:12px}
</style>
</head>

<body>

<header>
<div class="logo">Azamat <span>Food</span></div>
<button class="back" onclick="location.href='index.html'">← Ас мәзірі</button>
</header>

<main>
<h1>🛒 Себет</h1>

<div id="cart"></div>

<div id="checkout" class="checkout" style="display:none">
<h2>Тапсырыс беру</h2>

<label>
👤 Аты-жөніңіз
<input id="name" placeholder="Аты-жөніңізді енгізіңіз">
</label>

<label>
☎ Телефон нөміріңіз
<input id="phone" type="tel" placeholder="+7 7XX XXX XX XX">
</label>

<button class="send" onclick="order()">✈ Тапсырыс беру</button>

<div class="note">
Тапсырыс бергеннен кейін Telegram-ға жіберіледі және сізге алу коды беріледі.
</div>
</div>

</main>
