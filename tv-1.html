<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Azamat Food TV</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#111;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.header{
  height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:2px solid #292929;
  background:#151515;
}

.logo{
  font-size:42px;
  font-weight:900;
  color:#fff;
  letter-spacing:1px;
}

.logo span{
  color:#ffb000;
}

.main{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
  padding:25px;
  min-height:calc(100vh - 100px);
}

.column{
  background:#191919;
  border-radius:22px;
  padding:25px;
  border:1px solid #292929;
}

.title{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin-bottom:22px;
}

.preparing .title{
  color:#ffb000;
}

.ready .title{
  color:#39e66b;
}

.orders{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.order{
  background:#242424;
  border-radius:16px;
  padding:22px 25px;
  font-size:30px;
  font-weight:800;
  border-left:6px solid #555;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:78px;
}

.preparing .order{
  border-left-color:#ffb000;
}

.ready .order{
  border-left-color:#39e66b;
}

.number{
  font-size:36px;
  font-weight:900;
}

.name{
  text-align:right;
  margin-left:15px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.empty{
  text-align:center;
  color:#777;
  font-size:25px;
  padding:50px 10px;
}

.timer{
  font-size:18px;
  color:#888;
  margin-left:15px;
  white-space:nowrap;
}

@media(max-width:800px){
  .main{
    grid-template-columns:1fr;
  }

  .logo{
    font-size:32px;
  }

  .title{
    font-size:28px;
  }

  .order{
    font-size:24px;
  }

  .number{
    font-size:29px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Azamat <span>Food</span></div>
</header>

<main class="main">

  <section class="column preparing">
    <div class="title">Дайындалуда</div>
    <div id="preparingOrders" class="orders">
      <div class="empty">Тапсырыстар жоқ</div>
    </div>
  </section>

  <section class="column ready">
    <div class="title">Дайын</div>
    <div id="readyOrders" class="orders">
      <div class="empty">Тапсырыстар жоқ</div>
    </div>
  </section>

</main>

<script>

const API =
'https://script.google.com/macros/s/AKfycbyYx48fYTYzM6Yuukl2-Nb8_IqkUgyiRJgPRRBQs_RpMrHwcwdX39y9nt90wKQfFD8a/exec';

const READY_TIME = 4 * 60 * 1000;

const TIMER_KEY = 'azamat_food_tv_ready_timers';

function getTimers(){
  try{
    return JSON.parse(
      localStorage.getItem(TIMER_KEY) || '{}'
    );
  }catch(e){
    return {};
  }
}

function saveTimers(timers){
  try{
    localStorage.setItem(
      TIMER_KEY,
      JSON.stringify(timers)
    );
  }catch(e){}
}

function getReadyTime(order,timers){
  const key = String(order.orderNumber);

  /*
    Егер backend readyAt берсе,
    нақты дайын болған уақытты қолданамыз.
  */
  if(order.readyAt){
    const time =
      new Date(order.readyAt).getTime();

    if(!isNaN(time)){
      timers[key] = time;
      return time;
    }
  }

  /*
    Ескі тапсырыстарда readyAt болмаса,
    TV алғаш көрген уақытты қолданамыз.
  */
  if(!timers[key]){
    timers[key] = Date.now();
  }

  return timers[key];
}

function createOrder(order,showTimer){

  const box = document.createElement('div');
  box.className = 'order';

  const number =
    document.createElement('div');

  number.className = 'number';
  number.textContent =
    '№' + order.orderNumber;

  const right =
    document.createElement('div');

  right.style.display = 'flex';
  right.style.alignItems = 'center';

  const name =
    document.createElement('div');

  name.className = 'name';
  name.textContent =
    order.name || '';

  right.appendChild(name);

  if(showTimer){

    const timer =
      document.createElement('div');

    timer.className = 'timer';

    timer.dataset.readyTime =
      getReadyTime(
        order,
        window.currentTimers
      );

    right.appendChild(timer);

    updateTimer(timer);
  }

  box.appendChild(number);
  box.appendChild(right);

  return box;
}

function updateTimer(element){

  const readyTime =
    Number(element.dataset.readyTime);

  const left =
    READY_TIME - (Date.now() - readyTime);

  if(left <= 0){
    element.textContent = '';
    return;
  }

  const seconds =
    Math.ceil(left / 1000);

  const minutes =
    Math.floor(seconds / 60);

  const sec =
    seconds % 60;

  element.textContent =
    minutes + ':' +
    String(sec).padStart(2,'0');
}

function renderOrders(orders){

  const preparingBox =
    document.getElementById(
      'preparingOrders'
    );

  const readyBox =
    document.getElementById(
      'readyOrders'
    );

  preparingBox.innerHTML = '';
  readyBox.innerHTML = '';

  window.currentTimers =
    getTimers();

  const now = Date.now();

  const preparing =
    orders.filter(order =>
      order.status === 'preparing'
    );

  const ready = [];

  orders
    .filter(order =>
      order.status === 'ready'
    )
    .forEach(order => {

      const readyTime =
        getReadyTime(
          order,
          window.currentTimers
        );

      if(
        now - readyTime <
        READY_TIME
      ){
        ready.push(order);
      }

    });

  /*
    Ескірген timer-лерді тазалау.
  */
  Object.keys(window.currentTimers)
    .forEach(key => {

      const time =
        Number(window.currentTimers[key]);

      if(
        !time ||
        now - time >= READY_TIME
      ){
        delete window.currentTimers[key];
      }

    });

  saveTimers(window.currentTimers);

  if(preparing.length === 0){

    preparingBox.innerHTML =
      '<div class="empty">Тапсырыстар жоқ</div>';

  }else{

    preparing.forEach(order => {

      preparingBox.appendChild(
        createOrder(order,false)
      );

    });

  }

  if(ready.length === 0){

    readyBox.innerHTML =
      '<div class="empty">Тапсырыстар жоқ</div>';

  }else{

    ready.forEach(order => {

      readyBox.appendChild(
        createOrder(order,true)
      );

    });

  }

}

async function loadOrders(){

  try{

    const response =
      await fetch(
        API + '?action=getOrders&v=' +
        Date.now(),
        {
          cache:'no-store'
        }
      );

    const data =
      await response.json();

    if(Array.isArray(data)){
      renderOrders(data);
      return;
    }

    if(
      data &&
      Array.isArray(data.orders)
    ){
      renderOrders(data.orders);
      return;
    }

    console.log(
      'Orders format:',
      data
    );

  }catch(error){

    console.log(
      'TV connection error:',
      error
    );

  }

}

/*
  Таймерді әр секунд жаңартамыз.
*/
setInterval(() => {

  document
    .querySelectorAll('.timer')
    .forEach(updateTimer);

},1000);

/*
  Backend-тен тапсырыстарды
  әр 2 секунд сайын аламыз.
*/
loadOrders();

setInterval(
  loadOrders,
  2000
);

</script>

</body>
</html>
