<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azamat Food TV</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:white;font-family:Arial;height:100vh;overflow:hidden}header{height:90px;padding:20px 35px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #292929}.logo{font-size:30px;font-weight:900}.logo b{color:#ffc21a}.clock{color:#ffc21a;font-size:25px;font-weight:bold}main{height:calc(100vh - 90px);padding:25px 30px}.board{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:20px}.col{background:#151515;border:2px solid #292929;border-radius:22px;padding:22px}.col+ .col{border-color:#355d3b}.title{font-size:30px;font-weight:900;margin-bottom:20px}.card{background:#202020;border-radius:16px;padding:18px;margin-bottom:12px;font-size:30px;font-weight:900}.ready{background:#142217;color:#72e47f}.empty{color:#777;font-size:20px;text-align:center;margin-top:50px}@media(max-width:700px){.logo{font-size:22px}.clock{font-size:18px}header{padding:15px}.board{gap:10px}.col{padding:12px}.title{font-size:20px}.card{font-size:21px;padding:13px}}
</style>
</head>
<body>
<header><div class="logo">🍔 AZAMAT <b>FOOD</b></div><div id="clock" class="clock"></div></header>
<main><div class="board">
<section class="col"><div class="title">Дайындалуда</div><div id="prep" class="empty">Тапсырыс жоқ</div></section>
<section class="col"><div class="title">Дайын</div><div id="ready" class="empty">Тапсырыс жоқ</div></section>
</div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbygK7ORXrzae5pr4FSxWQRas_FGV8yuN051KGjLF_xMw5RPGIJD4Y0eKz7chL92aGA0/exec';
function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('kk-KZ')}setInterval(clock,1000);clock();
async function load(){try{let r=await fetch(API+'?action=orders&t='+Date.now());let d=await r.json();let p=d.orders.filter(x=>x.status!=='ready'&&x.status!=='done'),q=d.orders.filter(x=>x.status==='ready');document.getElementById('prep').innerHTML=p.length?p.map(x=>'<div class="card">№'+x.orderNumber+' '+x.name+'</div>').join():'Тапсырыс жоқ';document.getElementById('ready').innerHTML=q.length?q.map(x=>'<div class="card ready">№'+x.orderNumber+' '+x.name+'</div>').join():'Тапсырыс жоқ'}catch(e){}}load();setInterval(load,2000);
</script>
</body>
</html>
